<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="overflow-hidden">

    <section id="authModal" class="w-full h-screen overflow-hidden bg-white flex items-center justify-center p-4">
        
        <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 sm:p-12 relative transition duration-300">
            
            <div class="flex justify-center mb-6">
                <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center text-purple-700 text-2xl">
                    👤
                </div>
            </div>

            <!-- Register Form -->
            <div id="registerFormBlock" class="block space-y-6">
                
                <div class="text-center space-y-1">
                    <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 tracking-tight">
                        Create Account
                    </h2>
                    <p class="text-xs sm:text-sm text-gray-400 font-medium">
                        Join us today! It only takes a minute.
                    </p>
                </div>

                <form id="realRegisterForm" class="space-y-4">

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                        <div class="space-y-1.5">
                            <label class="text-xs font-bold text-gray-700">
                                Full Name
                            </label>

                            <input
                                type="text"
                                required
                                placeholder="John Doe"
                                class="w-full bg-gray-50 text-gray-700 text-xs sm:text-sm rounded-xl py-3 px-4 border border-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:bg-white transition"
                            >
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-xs font-bold text-gray-700">
                                Email Address
                            </label>

                            <input
                                type="email"
                                required
                                placeholder="name@company.com"
                                class="w-full bg-gray-50 text-gray-700 text-xs sm:text-sm rounded-xl py-3 px-4 border border-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:bg-white transition"
                            >
                        </div>

                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-gray-700">
                            Password
                        </label>

                        <input
                            type="password"
                            required
                            placeholder="••••••••"
                            class="w-full bg-gray-50 text-gray-700 text-xs sm:text-sm rounded-xl py-3 px-4 border border-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:bg-white transition"
                        >
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-gray-700">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            required
                            placeholder="••••••••"
                            class="w-full bg-gray-50 text-gray-700 text-xs sm:text-sm rounded-xl py-3 px-4 border border-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:bg-white transition"
                        >
                    </div>

                    <div class="flex items-start space-x-2 pt-1">

                        <input
                            type="checkbox"
                            required
                            id="termsCheck"
                            class="mt-0.5 rounded text-purple-600 focus:ring-purple-500 w-4 h-4 cursor-pointer"
                        >

                        <label
                            for="termsCheck"
                            class="text-[11px] sm:text-xs text-gray-400 font-medium leading-tight"
                        >
                            I agree to the
                            <a href="#" class="text-purple-600 underline">
                                Terms of Service
                            </a>
                            and
                            <a href="#" class="text-purple-600 underline">
                                Privacy Policy
                            </a>.
                        </label>

                    </div>

                    <button
                        type="submit"
                        class="w-full bg-[#5E3BE1] hover:bg-purple-700 text-white font-semibold text-sm py-4 rounded-xl shadow-lg transition flex items-center justify-center space-x-2"
                    >
                        <span>Create My Account</span>
                        <span>»</span>
                    </button>

                </form>

                <p class="text-center text-xs text-gray-400 font-medium pt-2">
                    Already have an account?

                    <span
                        id="toLoginBtn"
                        class="text-purple-600 font-bold underline cursor-pointer hover:text-purple-800"
                    >
                        Sign in here
                    </span>
                </p>

            </div>

            <!-- Login Form -->
            <div id="loginFormBlock" class="hidden space-y-6">

                <div class="text-center space-y-1">
                    <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 tracking-tight">
                        Sign In
                    </h2>

                    <p class="text-xs sm:text-sm text-gray-400 font-medium">
                        Welcome back! Please login to your account.
                    </p>
                </div>

                <form id="realLoginForm" class="space-y-4">

                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-gray-700">
                            Email Address
                        </label>

                        <input
                            type="email"
                            required
                            placeholder="name@company.com"
                            class="w-full bg-gray-50 text-gray-700 text-xs sm:text-sm rounded-xl py-3 px-4 border border-gray-100 focus:ring-2 focus:ring-purple-500/20 focus:bg-white transition"
                        >
                    </div>

                    <div class="space-y-1.5">

                        <div class="flex justify-between items-center">
                            <label class="text-xs font-bold text-gray-700">
                                Password
                            </label>

                            <a href="#" class="text-[11px] text-purple-600 underline font-medium">
                                Forgot?
                            </a>
                        </div>

                        <input
                            type="password"
                            required
                            placeholder="••••••••"
                            class="w-full bg-gray-50 text-gray-700 text-xs sm:text-sm rounded-xl py-3 px-4 border border-gray-100 focus:ring-2 focus:ring-purple-500/20 focus:bg-white transition"
                        >

                    </div>

                    <button
                        type="submit"
                        class="w-full bg-[#5E3BE1] hover:bg-purple-700 text-white font-semibold text-sm py-4 rounded-xl shadow-lg transition flex items-center justify-center space-x-2"
                    >
                        <span>Sign In to Account</span>
                        <span>»</span>
                    </button>

                </form>

                <p class="text-center text-xs text-gray-400 font-medium pt-2">
                    Don't have an account?

                    <span
                        id="toRegisterBtn"
                        class="text-purple-600 font-bold underline cursor-pointer hover:text-purple-800"
                    >
                        Register here
                    </span>
                </p>

            </div>

        </div>

    </section>

    <script>

        const registerBlock = document.getElementById('registerFormBlock');
        const loginBlock = document.getElementById('loginFormBlock');

        const toLoginBtn = document.getElementById('toLoginBtn');
        const toRegisterBtn = document.getElementById('toRegisterBtn');

        const realRegisterForm = document.getElementById('realRegisterForm');
        const realLoginForm = document.getElementById('realLoginForm');

        toLoginBtn.addEventListener('click', () => {
            registerBlock.classList.replace('block', 'hidden');
            loginBlock.classList.replace('hidden', 'block');
        });

        toRegisterBtn.addEventListener('click', () => {
            loginBlock.classList.replace('block', 'hidden');
            registerBlock.classList.replace('hidden', 'block');
        });

        realRegisterForm.addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Account Created Successfully!');
            realRegisterForm.reset();
        });

        realLoginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Logged In Successfully!');
            realLoginForm.reset();
        });

    </script>

</body>
</html>

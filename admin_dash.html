<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 overflow-hidden font-sans">
    <div class="flex h-screen overflow-hidden">
        <aside id="sidebar" class="fixed top-0 left-0 z-50 flex h-screen w-64 flex-col justify-between bg-[#050B2C] text-white transform -translate-x-full transition-transform duration-300 ease-in-out lg:translate-x-0">
            <div>
                <div class="flex items-center gap-3 border-b border-white/10 px-5 py-5">
                    <img src="development.png" alt="Logo" class="h-10 w-10 object-contain rounded-xl">
                    <h1 class="text-2xl font-bold"> MobileShop </h1>
                </div>
                <nav class="mt-6 flex flex-col gap-2 px-3">
                    <a href="#" class="flex items-center gap-3 rounded-xl bg-gradient-to-r from-fuchsia-500 to-purple-500 px-4 py-3">
                        <img src="layout.png" alt="Dashboard" class="h-4 w-4 object-contain">
                        <span class="text-sm font-medium">Dashboard</span>
                    </a>
                    <a href="#" class="flex items-center gap-3 rounded-xl px-4 py-3 transition hover:bg-white/10">
                        <img src="product-development.png" alt="Products" class="h-4 w-4 object-contain">
                        <span class="text-sm font-medium">Products</span>
                    </a>
                    <a href="#" class="flex items-center gap-3 rounded-xl px-4 py-3 transition hover:bg-white/10">
                        <img src="shopping-bag.png" alt="Orders" class="h-4 w-4 object-contain">
                        <span class="text-sm font-medium">Orders</span>
                    </a>
                    <a href="#" class="flex items-center gap-3 rounded-xl px-4 py-3 transition hover:bg-white/10">
                        <img src="user.png" alt="Users" class="h-4 w-4 object-contain">
                        <span class="text-sm font-medium">Users</span>
                    </a>
                </nav>
            </div>
            <div class="border-t border-white/10 p-4">
                <button class="w-full rounded-xl border border-white/10 bg-white/5 py-3 text-sm font-medium transition hover:bg-white/10">
                    Logout
                </button>
            </div>
        </aside>
        <div id="overlay"class="fixed inset-0 z-40 hidden bg-black/40 lg:hidden"></div>
        <main class="flex-1 overflow-y-auto lg:ml-64">
            <header class="sticky top-0 z-30 flex items-center justify-between border-b bg-white px-4 py-4 sm:px-6">
                <div class="flex items-center gap-4">
                    <button id="menuBtn"class="flex flex-col gap-1.5 lg:hidden">
                        <span class="h-0.5 w-6 bg-gray-800"></span>
                        <span class="h-0.5 w-6 bg-gray-800"></span>
                        <span class="h-0.5 w-6 bg-gray-800"></span>
                    </button>
                    <h2 class="text-2xl font-bold text-gray-800">Dashboard</h2>
                </div>
                <!-- PROFILE -->
                <div class="flex items-center gap-3">
                    <div class="hidden text-right sm:block">
                        <h3 class="text-lg font-bold text-gray-700">Admin</h3>
                        <p class="text-xs text-gray-400">Administrator</p>
                    </div>
                    <img src="user-setting.png" alt="Profile" class="h-11 w-11 rounded-full object-cover">
                </div>
            </header>
            <section class="space-y-5 p-4 sm:p-6">
                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
                    <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
                        <div class="flex items-center justify-between gap-4">
                            <div>
                                <p class="text-sm text-gray-400">Total Sales</p>
                                <h3 class="mt-2 text-3xl font-bold text-gray-800">$0.00</h3>
                            </div>
                            <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-green-100">
                                <img src="coin copy.png"alt="Sales"class="h-5 w-5 object-contain">
                            </div>
                        </div>
                    </div>
                    <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
                        <div class="flex items-center justify-between gap-4">
                            <div>
                                <p class="text-sm text-gray-400">Total Orders</p>
                                <h3 class="mt-2 text-3xl font-bold text-gray-800">0</h3>
                            </div>
                            <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-blue-100">
                                <img src="shopping-cart.png"alt="Orders" class="h-5 w-5 object-contain">
                            </div>
                        </div>
                    </div>
                    <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
                        <div class="flex items-center justify-between gap-4">
                            <div>
                                <p class="text-sm text-gray-400">Customers</p>
                                <h3 class="mt-2 text-3xl font-bold text-gray-800">1</h3>
                            </div>
                            <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-pink-100">
                                <img src="customer.png" alt="Customers" class="h-5 w-5 object-contain">
                            </div>
                        </div>
                    </div>
                    <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
                        <div class="flex items-center justify-between gap-4">
                            <div>
                                <p class="text-sm text-gray-400">Low Stock</p>
                                <h3 class="mt-2 text-3xl font-bold text-gray-800">0</h3>
                            </div>
                            <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-red-100">
                                <img src="warning.png"alt="Warning"class="h-5 w-5 object-contain">
                            </div>
                        </div>
                    </div>
                </div>
                <!-- TABLE -->
                <div class="overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-sm">
                    <div class="flex items-center justify-between border-b px-5 py-4">
                        <h3 class="text-2xl font-bold text-gray-800">Recent Orders</h3>
                        <a href="#"class="text-sm font-semibold text-fuchsia-600 hover:underline">View All</a>
                    </div>
                    <!-- TABLE -->
                    <div class="overflow-x-auto">
                        <table class="min-w-full">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-5 py-4 text-left text-xs font-bold uppercase tracking-wider text-gray-500">Order ID</th>
                                    <th class="px-5 py-4 text-left text-xs font-bold uppercase tracking-wider text-gray-500">Customer</th>
                                    <th class="px-5 py-4 text-left text-xs font-bold uppercase tracking-wider text-gray-500">Date</th>
                                    <th class="px-5 py-4 text-left text-xs font-bold uppercase tracking-wider text-gray-500">Total</th>
                                    <th class="px-5 py-4 text-left text-xs font-bold uppercase tracking-wider text-gray-500">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 bg-white">
                                <tr>
                                    <td colspan="5" class="px-5 py-16 text-center text-sm text-gray-400">No recent orders found.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <!-- JAVASCRIPT -->
    <script>
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        menuBtn.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        });

    </script>

</body>
</html>
